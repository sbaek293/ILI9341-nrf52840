# ── SPI bus ──────────────────────────────────────────────────────────────────
CONFIG_SPI=y

# ── ILI9341 display ───────────────────────────────────────────────────────────
CONFIG_ZMK_DISPLAY=y
CONFIG_ILI9341=y

# ── LVGL graphics ─────────────────────────────────────────────────────────────
CONFIG_LVGL=y
CONFIG_LV_Z_MEM_POOL_SIZE=16384
CONFIG_LV_Z_BITS_PER_PIXEL=16
CONFIG_LV_COLOR_DEPTH_16=y

# Use a dedicated work-queue so display updates don't block the main thread
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# ── XPT2046 touch controller ──────────────────────────────────────────────────
# Requires Zephyr ≥ 3.3 (input subsystem).  Enable the two lines below once
# you confirm your ZMK/Zephyr version ships the xpt2046 input driver.
# CONFIG_INPUT=y
# CONFIG_XPT2046=y
